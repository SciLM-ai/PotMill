[Main]
resume = 0
entropy = 1
featurize = 1
labeling = 1
fit = 1
pareto = 1
pops = 0
potential = 1
md = 1
uq = 1
nconfigurations = 100000
batch_size = 1000
device = cuda

[FitSNAP]
mlip = ACE
chem_elem = H Be W
filename = FitSNAP.in

[ourStructureGen]
method = multi_element
elements = H Be W
entropy_jobs_per_node = 32
entropy_cores_per_job = 1
twojmax = 8
n_atoms_min = 2
n_atoms_max = 25
n_renorm_configs = 100
n_optimizer_iterations = 10000
energy_mode = 1
epsilon = 1e-6
radius_width = 0.3
radius_beta_a = 1.25
radius_beta_b = 1.25
volume_scaling_min = 1.0
volume_scaling_max = 3.5

[ourLabeling]
calculator = GRACE
label_batch_size = 20
labeling_jobs_per_node = 1

[GRACE]
model = GRACE-2L-SMAX-OMAT-large
min_dist = 0.3

[ourFeaturization]
featurize_jobs_per_node = 5
featurize_cores_per_job = 4

[ourFit]
fit_jobs_per_node = 3
fit_method = svd
n_fold = 3
fit_engine = incremental
fit_cores_per_job = 1

[ourPotential]
which = pareto        # none | knee | pareto | all

[ourMD]
structure = auto        # 'auto' (lowest formation-energy config, replicated) or a path
min_atoms = 200
minimize = 1
relax_box = 0           # 1 = also relax the cell (harsher: an immature potential can collapse it)
ensemble = nvt
temperature = 300
timestep = 0.0005       # ps (0.5 fs; 1 fs loses atoms with H present)
steps = 20000           # 10 ps at 0.5 fs
max_potentials = 32

[ourUQ]
posterior = hypercube       # hypercube (sigma + worst-case bracket) | ensemble (sigma only)
minimum_relative_error = 0.01   # a row informs the uncertainty only if |residual| >= this x RMSE
percentile_clipping = 0.0       # >0 replaces the box's min/max by that percentile (robust, not worst-case)
max_potentials = 32

[ourHyperparameters]
min_rcut = 5
max_rcut = 6.5
num_rcut = 4
min_nmax = 5 2
max_nmax = 9 4
min_lmax = 0 1
max_lmax = 0 4
middle_eweight = 10
num_eweights = 5
