[Main]
resume = 0
entropy = 1
featurize = 1
labeling = 1
fit = 1
pareto = 1
pops = 1
potential = 1
md = 1
uq = 1
nconfigurations = 40
batch_size = 20
device = cuda

[FitSNAP]
mlip = ACE
chem_elem = W Re
filename = FitSNAP.in

[ourStructureGen]
method = binary
elements = W Re
twojmax = 4

[ourLabeling]
calculator = FAIRChemCalculator
label_batch_size = 1
labeling_jobs_per_node = 2

[FAIRChemCalculator]
name = uma-m-1p1
task_name = omat
device = cuda

[ourFeaturization]
featurize_jobs_per_node = 1
featurize_cores_per_job = 4

[ourFit]
fit_jobs_per_node = 2
fit_method = svd
n_fold = 3
fit_engine = incremental
fit_cores_per_job = 5

[ourPotential]
which = pareto        # none | knee | pareto | all

[ourMD]
structure = auto        # 'auto' (lowest formation-energy config, replicated) or a path
min_atoms = 200
minimize = 1
relax_box = 0           # 1 = also relax the cell (harsher: an immature potential can collapse it)
ensemble = nvt
temperature = 300
timestep = 0.0005       # ps (0.5 fs; 1 fs loses atoms with H present)
steps = 20000           # 10 ps at 0.5 fs
max_potentials = 32

[ourUQ]
posterior = hypercube       # hypercube (sigma + worst-case bracket) | ensemble (sigma only)
minimum_relative_error = 0.01   # a row informs the uncertainty only if |residual| >= this x RMSE
percentile_clipping = 0.0       # >0 replaces the box's min/max by that percentile (robust, not worst-case)
max_potentials = 32

[ourHyperparameters]
min_rcut = 5
max_rcut = 6
num_rcut = 3
min_nmax = 8 3
max_nmax = 10 4
min_lmax = 0 1
max_lmax = 0 2
middle_eweight = 10
num_eweights = 3
